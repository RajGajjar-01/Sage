[project]
name = "sage"
version = "0.1.0"
description = "Autonomous coding agent with a sandboxed workspace, multi-provider LLM fallback, and a FastAPI-backed CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.139.0",
    "fastapi-cli>=0.0.28",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.26.8",
    "uvicorn>=0.50.0",
]

[project.scripts]
sage = "app.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, vars)
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modernize syntax)
    "T201",   # ban print() statements
]
ignore = [
    "E501",   # line too long (ruff format handles it)
    "B008",   # function calls in argument defaults (FastAPI uses this)
    "B904",   # allow raising HTTPException without `from e`
]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[[tool.mypy.overrides]]
module = "aiosqlite"
ignore_missing_imports = true
