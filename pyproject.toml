[project]
name = "dotagent"
version = "0.1.0"
description = "Autonomous coding agent with a sandboxed workspace, multi-provider LLM fallback, and a FastAPI-backed CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi>=0.136.0",
    "fastapi-cli>=0.0.24",
    "httpx>=0.28.1",
    "openai>=1.99.0",
    "pydantic-settings>=2.13.1",
    "rich>=13.9.4",
    "typer>=0.15.1",
    "uvicorn>=0.44.0",
]

[project.scripts]
dotagent = "app.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.15.11",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, vars)
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modernize syntax)
    "T201",   # ban print() statements
]
ignore = [
    "E501",   # line too long (ruff format handles it)
    "B008",   # function calls in argument defaults (FastAPI uses this)
    "B904",   # allow raising HTTPException without `from e`
]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic"]

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[[tool.mypy.overrides]]
module = "aiosqlite"
ignore_missing_imports = true
